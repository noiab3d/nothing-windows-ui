[package]
name = "nothing-windows-ui"
version = "1.1.1"
description = "Unofficial system tray control panel for Nothing earbuds on Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"

[dependencies.windows]
version = "0.61"
features = [
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
